<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body {
        margin: 0;
        padding: 16px;
        font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #111827;
      }
      label {
        display: block;
        margin: 0 0 6px;
        font-weight: 600;
      }
      input {
        box-sizing: border-box;
        width: 100%;
        height: 32px;
        border: 1px solid #d1d5db;
        border-radius: 6px;
        padding: 0 8px;
      }
      button {
        height: 34px;
        margin-top: 12px;
        border: 0;
        border-radius: 6px;
        color: white;
        background: #1654d6;
        font-weight: 600;
      }
      .actions {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
      }
      .actions button:last-child {
        grid-column: 1 / -1;
      }
      .secondary {
        color: #111827;
        background: #e5e7eb;
      }
      pre {
        min-height: 72px;
        margin: 12px 0 0;
        white-space: pre-wrap;
        color: #374151;
      }
    </style>
  </head>
  <body>
    <label for="endpoint">Local API endpoint</label>
    <input id="endpoint" value="http://localhost:8787/api/snapshots" />
    <div class="actions">
      <button id="check" class="secondary">Check Local API</button>
      <button id="sync">Sync Selection</button>
      <button id="export" class="secondary">Export Snapshot ZIP</button>
    </div>
    <pre id="status">Select a Frame, Component, Instance, or Section.</pre>
    <script>
      const endpoint = document.getElementById("endpoint");
      const status = document.getElementById("status");
      document.getElementById("check").onclick = () => {
        status.textContent = "Checking...";
        parent.postMessage(
          {
            pluginMessage: {
              type: "check-health",
              endpoint: endpoint.value
            }
          },
          "*"
        );
      };
      document.getElementById("sync").onclick = () => {
        status.textContent = "Syncing...";
        parent.postMessage(
          {
            pluginMessage: {
              type: "sync-selection",
              endpoint: endpoint.value
            }
          },
          "*"
        );
      };
      document.getElementById("export").onclick = () => {
        status.textContent = "Exporting offline ZIP...";
        parent.postMessage(
          {
            pluginMessage: {
              type: "export-snapshot-zip"
            }
          },
          "*"
        );
      };
      window.onmessage = (event) => {
        const message = event.data.pluginMessage;
        if (!message) return;
        if (message.type === "snapshot-zip") {
          const binary = atob(message.bytesBase64);
          const bytes = new Uint8Array(binary.length);
          for (let index = 0; index < binary.length; index += 1) bytes[index] = binary.charCodeAt(index);
          const url = URL.createObjectURL(new Blob([bytes], { type: "application/zip" }));
          const link = document.createElement("a");
          link.href = url;
          link.download = message.fileName || "uxcompiler_snapshot.zip";
          document.body.appendChild(link);
          link.click();
          link.remove();
          URL.revokeObjectURL(url);
        }
        status.textContent = message.message || JSON.stringify(message, null, 2);
      };
    </script>
  </body>
</html>
